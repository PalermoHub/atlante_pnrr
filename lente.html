<body class="lente-pag">
<header class="top">
  <a class="brand" href="index.html" aria-label="Atlante del PNRR, pagina iniziale"><img src="img/logo-pnrr.svg" width="40" height="40" alt=""><div><strong>Atlante del PNRR</strong><span>la lente · prototipo 3 · dati al 13 giugno 2026</span></div></a>
  <nav class="nav" aria-label="Sezioni"><a href="index.html">Mappa e schede</a><a href="lente.html" aria-current="page">La lente</a><a href="statistiche.html">Statistiche</a></nav>
  <div class="tools">
    <label class="sr" for="sel-tema" style="position:absolute;left:-9999px">Tema</label>
    <select id="sel-tema" aria-label="Tema dell'interfaccia">
      <option value="auto">Sistema</option><option value="chiaro">Chiaro</option><option value="scuro">Scuro</option>
      <option value="contrasto">Alto contrasto</option>
    </select>
  </div>
</header>
<main class="lente-main">
  <div class="lente-barra">
    <label class="cerca-c">Comune <input id="cerca" type="search" list="elenco" placeholder="Cerca un comune…" autocomplete="off" aria-label="Cerca un comune"></label><datalist id="elenco"></datalist>
    <div class="seg" role="group" aria-label="Modalità della lente"><button type="button" data-modo="centro" aria-pressed="false" aria-label="Lente al centro" title="Lente al centro: resta ferma e si sposta la mappa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button><button type="button" data-modo="libera" aria-pressed="true" aria-label="Lente libera" title="Lente libera: la mappa resta ferma e si trascina la lente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button></div>
    <button id="azzera" type="button">Azzera</button>
    <span id="sintesi" class="sintesi" aria-live="polite"></span>
  </div>
  <div class="lente-corpo">
    <section class="lente-mappa" aria-label="Mappa con la lente">
      <div id="map" role="img" aria-label="Mappa dei comuni italiani colorata per euro PNRR per abitante; la lente al centro analizza il comune sotto la croce"></div>
      <svg id="lente" class="lente-svg" aria-label="Raggiera dei progetti del comune al centro, per missione e stadio"></svg>
      <div id="tip" class="lente-tip" hidden></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
